[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thai-ukrainian-phonetic-system"
version = "0.6.1"
description = "Research-oriented Thai to Ukrainian phonetic-graphemic correspondence model"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
excel = ["openpyxl>=3.1.5"]

[project.scripts]
thai-ua = "thai_ukrainian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
