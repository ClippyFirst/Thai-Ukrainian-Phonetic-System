[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thai-ukrainian-phonetic-system"
version = "0.2.0"
description = "Research-oriented Thai to Ukrainian phonetic-graphemic correspondence model"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
