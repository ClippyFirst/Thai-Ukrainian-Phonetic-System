[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thai-ukrainian-phonetic-system"
dynamic = ["version"]
description = "Research-oriented Thai to Ukrainian phonetic-graphemic correspondence model"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
excel = ["openpyxl>=3.1.5"]
dev = ["ruff==0.17.3"]

[project.scripts]
thai-ua = "thai_ukrainian.cli:main"

[tool.setuptools.dynamic]
version = {attr = "thai_ukrainian._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thai_ukrainian = ["_data/*", "_data/thai/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F"]
