[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thai-ukrainian-phonetic-system"
dynamic = ["version"]
description = "Research-oriented Thai to Ukrainian phonetic-graphemic correspondence model"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
excel = ["openpyxl>=3.1.5"]
dev = ["ruff==0.17.3", "pytest==9.2.0"]
geography = ["pythainlp==5.4.0"]
fastthaig2p = [
    "fastapi==0.117.1",
    "pythainlp==5.4.0",
    "fastthaig2p @ git+https://github.com/awslabs/FastThaiG2P.git@4e82a291b4cf2876326744c6580121e9986ad354",
]

[project.scripts]
thai-ua = "thai_ukrainian.cli:main"

[tool.setuptools.dynamic]
version = {attr = "thai_ukrainian._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thai_ukrainian = ["_data/*", "_data/thai/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F"]
