name: Deploy web to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "data/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/**"
      - "data/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run Python regression tests
        run: |
          python -m pip install -e ".[dev,fastthaig2p]"
          python scripts/generate_master_table.py
          python -m unittest discover -s tests -v
      - name: Validate browser parity
        run: |
          python -m pip install -e ".[dev]" fastapi==0.117.1 pythainlp==5.4.0
          python scripts/generate_web_fixtures.py
          cmp web/tests/fixtures.json web/tests/fixtures.python.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned RTGS parity reference
        run: python -m pip install pythainlp==5.4.0
      - name: Generate pinned CC0 browser word dictionary
        run: python scripts/generate_web_word_dictionary.py
      - name: Run RTGS browser regression tests
        run: node web/tests/rtgs-reference.test.mjs
      - name: Run RTGS reference parity tests
        run: python scripts/test_rtgs_parity.py
      - name: Run IPA adaptation browser tests
        run: node web/tests/ipa-ua.test.mjs
      - name: Run browser parity test
        run: node web/tests/parity.test.mjs
      - name: Run article markup cleanup contract test
        run: node web/tests/article-cleanup.test.mjs
      - name: Run UI contract and beta disclosure checks
        run: node web/tests/ui-contract.test.mjs
      - name: Run static accessibility contract checks
        run: node web/tests/accessibility-contract.test.mjs
      - name: Build self-hosted Pyodide runtime for Pages
        run: |
          mkdir -p build/pyodide-wheels
          python -m pip wheel --no-deps --wheel-dir build/pyodide-wheels .
          python -m pip download --no-deps --only-binary=:all: --dest build/pyodide-wheels pythainlp==5.4.0
          python -m pip download --no-deps --only-binary=:all: --dest build/pyodide-wheels tzdata==2026.6
          python scripts/slim_pythainlp_wheel.py build/pyodide-wheels/pythainlp-5.4.0-py3-none-any.whl
          git clone https://github.com/awslabs/FastThaiG2P.git build/FastThaiG2P
          git -C build/FastThaiG2P checkout 4e82a291b4cf2876326744c6580121e9986ad354
          git clone https://github.com/attapol/tltk.git build/TLTK
          git -C build/TLTK checkout 0cef4bcfbdd675f589783dd4134b87b9bb9fbb93
          python scripts/verify_tltk_fallback_provenance.py --fastthaig2p build/FastThaiG2P --tltk build/TLTK --report build/tltk-fallback-provenance.json
          python scripts/prepare_fastthaig2p_browser_source.py --source build/FastThaiG2P --report build/fastthaig2p-data-provenance.json
          python scripts/extract_fastthaig2p_normalizer_data.py --source build/FastThaiG2P
          python -m unittest discover -s tests -p test_fastthaig2p_browser_data.py -v
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/fastthaig2p-data-provenance.json").read_text())
          assert report["retained_entries"] == report["retained_dictionary_words"]
          assert report["retained_counts"].get("wiktionary", 0) > 0
          assert report["excluded_counts"].get("generated", 0) > 0
          assert "generated" not in report["retained_counts"]
          assert "manual" not in report["retained_counts"]
          PY
          python -m pip wheel --no-deps --wheel-dir build/pyodide-wheels ./build/FastThaiG2P
          npm install --no-save --no-package-lock pyodide@0.29.5
          python scripts/build_pyodide_bundle.py \
            --purpose pages \
            --pyodide-dist node_modules/pyodide \
            --wheels build/pyodide-wheels \
            --output web/vendor \
            --rights-manifest data/third_party/fastthaig2p-browser-bundle.json \
            --notices-dir web/licenses
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("web/vendor/native/manifest.json").read_text())
          assert manifest["dictionary_entries"] == 13144
          assert manifest["normalizer_license"] == "Apache-2.0"
          assert manifest["pythainlp_version"] == "5.4.0"
          assert manifest["pythainlp_wordlist_license"] == "CC0-1.0"
          assert manifest["pythainlp_wordlist_entries"] > 0
          assert manifest["stage"] == "dictionary-normalizer-and-default-wordlist-data-only; not a complete runtime"
          for asset in manifest["assets"]:
              path = Path("web/vendor") / asset["path"]
              assert path.is_file() and path.stat().st_size == asset["size_bytes"]
          PY
          python scripts/extract_tltk_oov_data.py --fallback-dir build/FastThaiG2P/data/fallback --parser-source build/FastThaiG2P/fastthaig2p/_th2ipa.py --output-dir web/vendor/native-oov
          python -m unittest discover -s tests -p test_extract_tltk_oov_data.py -v
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("web/vendor/native-oov/manifest.json").read_text())
          payload = Path("web/vendor/native-oov/tltk-oov-data.json.gz")
          assert manifest["schema_version"] == 1
          assert manifest["license"] == "BSD-3-Clause"
          assert manifest["tltk_package_version"] == "1.9.1"
          assert payload.is_file()
          assert payload.stat().st_size == manifest["compressed_size_bytes"]
          assert manifest["record_counts"]["syllable_patterns"] > 0
          assert manifest["record_counts"]["syllable_dictionary"] > 0
          assert manifest["record_counts"]["phone_trigrams"] > 0
          assert manifest["record_counts"]["syllable_trigrams"] > 0
          assert manifest["record_counts"]["word_dictionary"] > 0
          PY
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published native-first FastThaiG2P Pages service and local-processing contract
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$PAGE_URL" -o /tmp/deployed-index.html \
              && grep -Fq 'Побачте, як прочитати тайський текст' /tmp/deployed-index.html \
              && grep -Fq 'Спочатку працює нативний JavaScript-порт FastThaiG2P' /tmp/deployed-index.html \
              && grep -Fq 'id="thai-input"' /tmp/deployed-index.html \
              && grep -Fq 'id="analyze"' /tmp/deployed-index.html \
              && curl --fail --silent --show-error "$PAGE_URL/src/app.js?v=20261106-ukrainian-first-1" -o /tmp/deployed-app.js \
              && curl --fail --silent --show-error "$PAGE_URL/src/fastthaig2p-native-worker.js" -o /tmp/deployed-native-worker.js \
              && curl --fail --silent --show-error "$PAGE_URL/src/fastthaig2p-native.js" -o /tmp/deployed-native.js \
              && curl --fail --silent --show-error "$PAGE_URL/src/fastthaig2p-worker.js" -o /tmp/deployed-pyodide-worker.js \
              && curl --fail --silent --show-error "$PAGE_URL/src/styles.css?v=20261106-ukrainian-first-1" -o /tmp/deployed-styles.css \
              && grep -Fq 'native_dictionary_miss' /tmp/deployed-app.js \
              && grep -Fq 'fastthaig2p-native-worker.js' /tmp/deployed-app.js \
              && grep -Fq 'fastthaig2p-worker.js' /tmp/deployed-app.js \
              && grep -Fq 'loadFastThaiG2PNativeAssets' /tmp/deployed-native-worker.js \
              && grep -Fq 'createFastThaiG2PNativePipeline' /tmp/deployed-native-worker.js \
              && grep -Fq 'native_dictionary_miss' /tmp/deployed-native.js \
              && grep -Fq 'bundle-manifest.json' /tmp/deployed-pyodide-worker.js \
              && grep -Fq 'SHA-256' /tmp/deployed-pyodide-worker.js \
              && ! grep -Fq '/api/analyze' /tmp/deployed-app.js \
              && ! grep -Fq 'cdn.jsdelivr.net' /tmp/deployed-pyodide-worker.js \
              && grep -Fq '@media (forced-colors: active)' /tmp/deployed-styles.css \
              && curl --fail --silent --show-error "$PAGE_URL/system.html" -o /tmp/deployed-system.html \
              && grep -Fq 'нативний JavaScript-порт FastThaiG2P' /tmp/deployed-system.html \
              && grep -Fq 'Pyodide Worker' /tmp/deployed-system.html \
              && grep -Fq 'не надсилається на API або зовнішній сервер' /tmp/deployed-system.html \
              && curl --fail --silent --show-error "$PAGE_URL/third-party-notices.html" -o /tmp/deployed-notices.html \
              && grep -Fq 'BSD-3-Clause' /tmp/deployed-notices.html \
              && grep -Fq 'LGPL-3.0' /tmp/deployed-notices.html \
              && curl --fail --silent --show-error "$PAGE_URL/vendor/bundle-manifest.json" -o /tmp/bundle-manifest.json \
              && curl --fail --silent --show-error "$PAGE_URL/vendor/native/manifest.json" -o /tmp/native-manifest.json \
              && curl --fail --silent --show-error "$PAGE_URL/vendor/native-oov/manifest.json" -o /tmp/native-oov-manifest.json \
              && python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen

          base = os.environ["PAGE_URL"].rstrip("/")
          def get(path):
              return urlopen(f"{base}/{path}").read()

          bundle = json.loads(Path("/tmp/bundle-manifest.json").read_text())
          assert bundle["purpose"] == "public-pages"
          assert bundle["redistribution_approved"] is True
          assert bundle["pyodide"]["version"] == "0.29.5"
          expected_versions = {
              "fastthaig2p": "0.1.0",
              "pythainlp": "5.4.0",
              "thai-ukrainian-phonetic-system": "0.6.1",
              "tzdata": "2026.6",
          }
          assert {wheel["package"]: wheel["version"] for wheel in bundle["wheels"]} == expected_versions

          datasets = {item["path"]: item for item in bundle["datasets"]}
          dataset = datasets["datasets/fastthaig2p-wiktionary-derived.zip"]
          payload = get("vendor/" + dataset["path"])
          assert len(payload) == dataset["size_bytes"]
          assert hashlib.sha256(payload).hexdigest() == dataset["sha256"]

          required_notices = {
              "licenses/Apache-2.0-FastThaiG2P.txt",
              "licenses/NOTICE-FastThaiG2P.txt",
              "licenses/Apache-2.0-PyThaiNLP.txt",
              "licenses/PyThaiNLP-corpus-license.md",
              "licenses/MPL-2.0-Pyodide.txt",
              "licenses/Apache-2.0-tzdata.txt",
              "licenses/BSD-3-Clause-TLTK.txt",
              "licenses/LGPL-3.0-TLTK-repository-license.txt",
              "licenses/CC-BY-SA-4.0.txt",
              "licenses/MIT-Project.txt",
          }
          notices = {item["path"]: item for item in bundle["notices"]}
          assert required_notices <= notices.keys()
          for path, item in notices.items():
              payload = get(path)
              assert len(payload) == item["size_bytes"], path
              assert hashlib.sha256(payload).hexdigest() == item["sha256"], path

          page = get("third-party-notices.html").decode("utf-8")
          assert "Wiktionary" in page and "CC BY-SA 4.0" in page
          assert "BSD-3-Clause" in page and "LGPL-3.0" in page
          assert "GNU Free Documentation License 1.3" in page

          oov = json.loads(Path("/tmp/native-oov-manifest.json").read_text())
          oov_payload = get("vendor/native-oov/" + oov["path"])
          assert oov["license"] == "BSD-3-Clause"
          assert oov["tltk_package_version"] == "1.9.1"
          assert len(oov["parser_source_sha256"]) == 64
          assert len(oov_payload) == oov["compressed_size_bytes"]
          assert hashlib.sha256(oov_payload).hexdigest() == oov["compressed_sha256"]

          native = json.loads(Path("/tmp/native-manifest.json").read_text())
          assert native["schema_version"] == 1
          assert native["dictionary_entries"] == 13144
          assert native["stage"] == "dictionary-normalizer-and-default-wordlist-data-only; not a complete runtime"
          assert len(bundle["native_assets"]) == 6
          for item in bundle["native_assets"]:
              payload = get("vendor/" + item["path"])
              assert len(payload) == item["size_bytes"], item["path"]
              assert hashlib.sha256(payload).hexdigest() == item["sha256"], item["path"]

          for asset in ("pyodide.mjs", "pyodide.asm.js", "pyodide.asm.wasm", "python_stdlib.zip"):
              payload = get("vendor/pyodide/" + asset)
              assert payload, asset
          print("Published native-first FastThaiG2P UI, same-origin workers, integrity manifests, notices, Wiktionary data and Pyodide OOV fallback verified.")
          PY
            then
              echo "Published native-first FastThaiG2P service and Pyodide OOV fallback verified at $PAGE_URL"
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Published native-first Pages service contract did not appear after 12 attempts" >&2
              exit 1
            fi
            sleep 5
          done
