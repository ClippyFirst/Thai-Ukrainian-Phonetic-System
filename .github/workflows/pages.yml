name: Deploy web to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "data/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run Python regression tests
        run: |
          python -m pip install -e .
          python scripts/generate_master_table.py
          python -m unittest discover -s tests -v
      - name: Validate browser parity
        run: |
          python -m pip install -e .
          python scripts/generate_web_fixtures.py
          cmp web/tests/fixtures.json web/tests/fixtures.python.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Generate pinned CC0 browser word dictionary
        run: python scripts/generate_web_word_dictionary.py
      - name: Run browser parity test
        run: node web/tests/parity.test.mjs
      - name: Run UI contract and beta disclosure checks
        run: node web/tests/ui-contract.test.mjs
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published whole-text UI contract
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$PAGE_URL" -o /tmp/deployed-index.html \
              && grep -Fq 'Вставте цілий текст або статтю' /tmp/deployed-index.html \
              && grep -Fq 'data-example="กา"' /tmp/deployed-index.html \
              && grep -Fq 'data-example="จริง"' /tmp/deployed-index.html \
              && grep -Fq 'id="engine-mode"' /tmp/deployed-index.html \
              && grep -Fq 'value="soft"' /tmp/deployed-index.html \
              && grep -Fq 'БЕТА · ДОСЛІДНИЦЬКА ВЕРСІЯ' /tmp/deployed-index.html \
              && curl --fail --silent --show-error "$PAGE_URL/src/app.js" -o /tmp/deployed-app.js \
              && grep -Fq 'Цілісний результат' /tmp/deployed-app.js \
              && grep -Fq 'continuous-output-value' /tmp/deployed-app.js \
              && grep -Fq 'softSyllabify' /tmp/deployed-app.js \
              && grep -Fq 'М’який режим — попередній результат' /tmp/deployed-app.js; then
              echo "Published homepage contract verified at $PAGE_URL"
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Published homepage did not expose the expected whole-text UI contract after 12 attempts" >&2
              exit 1
            fi
            sleep 5
          done
