name: Deploy web to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "data/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run Python regression tests
        run: |
          python -m pip install -e .
          python scripts/generate_master_table.py
          python -m unittest discover -s tests -v
      - name: Validate browser parity
        run: |
          python -m pip install -e .
          python scripts/generate_web_fixtures.py
          cmp web/tests/fixtures.json web/tests/fixtures.python.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install pinned RTGS parity reference
        run: python -m pip install pythainlp==5.4.0
      - name: Generate pinned CC0 browser word dictionary
        run: python scripts/generate_web_word_dictionary.py
      - name: Run RTGS browser regression tests
        run: node web/tests/rtgs-reference.test.mjs
      - name: Run RTGS reference parity tests
        run: python scripts/test_rtgs_parity.py
      - name: Run IPA adaptation browser tests
        run: node web/tests/ipa-ua.test.mjs
      - name: Run browser parity test
        run: node web/tests/parity.test.mjs
      - name: Run article markup cleanup contract test
        run: node web/tests/article-cleanup.test.mjs
      - name: Run UI contract and beta disclosure checks
        run: node web/tests/ui-contract.test.mjs
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published whole-text UI and RTGS contract
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$PAGE_URL" -o /tmp/deployed-index.html \
              && grep -Eq 'Вставте (цілий текст або статтю|слово або фрагмент тексту)' /tmp/deployed-index.html \
              && grep -Fq 'data-example="กา"' /tmp/deployed-index.html \
              && grep -Fq 'data-example="จริง"' /tmp/deployed-index.html \
              && grep -Fq 'id="engine-mode"' /tmp/deployed-index.html \
              && grep -Fq 'value="soft"' /tmp/deployed-index.html \
              && grep -Fq 'value="super-soft"' /tmp/deployed-index.html \
              && grep -Eq 'Суперм’який — (повне покриття, приблизні звуки|приблизний кандидат для кожного фрагмента)' /tmp/deployed-index.html \
              && grep -Fq 'БЕТА · ДОСЛІДНИЦЬКА ВЕРСІЯ' /tmp/deployed-index.html \
              && grep -Fq 'id="ipa-input"' /tmp/deployed-index.html \
              && grep -Fq 'id="ipa-adapt"' /tmp/deployed-index.html \
              && grep -Fq 'id="ipa-adapter-result"' /tmp/deployed-index.html \
              && curl --fail --silent --show-error "$PAGE_URL/src/app.js" -o /tmp/deployed-app.js \
              && curl --fail --silent --show-error "$PAGE_URL/src/engine.js" -o /tmp/deployed-engine.js \
              && curl --fail --silent --show-error "$PAGE_URL/src/ipa-ua.js" -o /tmp/deployed-ipa-ua.js \
              && curl --fail --silent --show-error "$PAGE_URL/src/rtgs-reference.js" -o /tmp/deployed-rtgs.js \
              && grep -Fq 'Цілісний результат' /tmp/deployed-app.js \
              && grep -Fq 'continuous-output-value' /tmp/deployed-app.js \
              && grep -Fq 'adaptIpaToUkrainian(source)' /tmp/deployed-app.js \
              && grep -Fq 'RTGS — латинська романізація (не IPA)' /tmp/deployed-app.js \
              && grep -Fq 'renderRtgsTokens' /tmp/deployed-app.js \
              && grep -Fq 'romanizeRtgsWord' /tmp/deployed-rtgs.js \
              && grep -Fq 'IPA delimiters are mismatched' /tmp/deployed-ipa-ua.js \
              && grep -Fq 'softSyllabify' /tmp/deployed-engine.js \
              && grep -Fq 'М’який режим — попередній результат' /tmp/deployed-app.js \
              && grep -Fq 'Суперм’який' /tmp/deployed-app.js \
              && grep -Fq 'super-soft-approximate' /tmp/deployed-engine.js \
              && grep -Fq 'UNVERIFIED_ORTHOGRAPHIC_FALLBACK' /tmp/deployed-engine.js; then
              echo "Published homepage and RTGS contract verified at $PAGE_URL"
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Published homepage or RTGS contract did not appear after 12 attempts" >&2
              for marker in 'data-example="กา"' 'data-example="จริง"' 'id="engine-mode"' 'value="soft"' 'value="super-soft"' 'БЕТА · ДОСЛІДНИЦЬКА ВЕРСІЯ' 'id="ipa-input"' 'id="ipa-adapt"' 'id="ipa-adapter-result"'; do
                grep -Fq "$marker" /tmp/deployed-index.html || echo "Missing homepage marker: $marker" >&2
              done
              if [ -f /tmp/deployed-app.js ]; then
                for marker in 'Цілісний результат' 'continuous-output-value' 'М’який режим — попередній результат' 'Суперм’який' 'adaptIpaToUkrainian(source)' 'RTGS — латинська романізація (не IPA)' 'renderRtgsTokens'; do
                  grep -Fq "$marker" /tmp/deployed-app.js || echo "Missing app marker: $marker" >&2
                done
              else
                echo "Missing deployed app.js file" >&2
              fi
              if [ -f /tmp/deployed-rtgs.js ]; then
                grep -Fq 'romanizeRtgsWord' /tmp/deployed-rtgs.js || echo "Missing RTGS marker: romanizeRtgsWord" >&2
              else
                echo "Missing deployed rtgs-reference.js file" >&2
              fi
              exit 1
            fi
            sleep 5
          done
