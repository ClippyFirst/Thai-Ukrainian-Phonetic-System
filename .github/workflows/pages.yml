name: Deploy web to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "data/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run Python regression tests
        run: |
          python -m pip install -e .
          python scripts/generate_master_table.py
          python -m unittest discover -s tests -v
      - name: Validate browser parity
        run: |
          python -m pip install -e .
          python scripts/generate_web_fixtures.py
          cmp web/tests/fixtures.json web/tests/fixtures.python.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install pinned RTGS parity reference
        run: python -m pip install pythainlp==5.4.0
      - name: Generate pinned CC0 browser word dictionary
        run: python scripts/generate_web_word_dictionary.py
      - name: Run RTGS browser regression tests
        run: node web/tests/rtgs-reference.test.mjs
      - name: Run RTGS reference parity tests
        run: python scripts/test_rtgs_parity.py
      - name: Run IPA adaptation browser tests
        run: node web/tests/ipa-ua.test.mjs
      - name: Run browser parity test
        run: node web/tests/parity.test.mjs
      - name: Run article markup cleanup contract test
        run: node web/tests/article-cleanup.test.mjs
      - name: Run UI contract and beta disclosure checks
        run: node web/tests/ui-contract.test.mjs
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published plain-language service and transcription pipeline
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$PAGE_URL" -o /tmp/deployed-index.html \
              && grep -Fq 'Як прочитати тайський текст українською' /tmp/deployed-index.html \
              && grep -Fq 'Вставте слово або речення тайською' /tmp/deployed-index.html \
              && grep -Fq 'Текст залишається у вашому браузері' /tmp/deployed-index.html \
              && grep -Fq 'ТЕСТОВА ВЕРСІЯ' /tmp/deployed-index.html \
              && grep -Fq 'Як діяти, якщо слово незнайоме?' /tmp/deployed-index.html \
              && grep -Fq 'Обережно — не вгадувати' /tmp/deployed-index.html \
              && grep -Fq 'Запропонувати приблизне читання' /tmp/deployed-index.html \
              && grep -Fq 'data-example="กา"' /tmp/deployed-index.html \
              && grep -Fq 'data-example="จริง"' /tmp/deployed-index.html \
              && grep -Fq 'id="engine-mode"' /tmp/deployed-index.html \
              && grep -Fq 'value="soft"' /tmp/deployed-index.html \
              && grep -Fq 'value="super-soft"' /tmp/deployed-index.html \
              && grep -Fq 'Що означає результат' /tmp/deployed-index.html \
              && ! grep -Fq 'id="ipa-input"' /tmp/deployed-index.html \
              && ! grep -Fq 'id="ipa-adapt"' /tmp/deployed-index.html \
              && curl --fail --silent --show-error "$PAGE_URL/src/app.js?v=20261030-plain-language-2" -o /tmp/deployed-app.js \
              && curl --fail --silent --show-error "$PAGE_URL/src/engine.js" -o /tmp/deployed-engine.js \
              && curl --fail --silent --show-error "$PAGE_URL/src/ipa-ua.js" -o /tmp/deployed-ipa-ua.js \
              && curl --fail --silent --show-error "$PAGE_URL/src/rtgs-reference.js" -o /tmp/deployed-rtgs.js \
              && curl --fail --silent --show-error "$PAGE_URL/system.html" -o /tmp/deployed-system.html \
              && grep -Fq 'Як сервіс читає тайський текст' /tmp/deployed-system.html \
              && grep -Fq 'Технічні подробиці для дослідників' /tmp/deployed-system.html \
              && grep -Fq 'Що вже перевірено' /tmp/deployed-system.html \
              && grep -Fq 'не маємо незалежно перевіреного фахівцями набору' /tmp/deployed-system.html \
              && grep -Fq 'Латинський запис' /tmp/deployed-app.js \
              && grep -Fq '02 · Запис звуків IPA' /tmp/deployed-app.js \
              && grep -Fq '03 · Українськими літерами' /tmp/deployed-app.js \
              && grep -Fq 'Для частини слів сервіс зробив припущення' /tmp/deployed-app.js \
              && grep -Fq 'Це приблизне читання' /tmp/deployed-app.js \
              && grep -Fq 'continuous-output-value' /tmp/deployed-app.js \
              && grep -Fq 'renderRtgsTokens' /tmp/deployed-app.js \
              && grep -Fq 'romanizeRtgsWord' /tmp/deployed-rtgs.js \
              && grep -Fq 'IPA delimiters are mismatched' /tmp/deployed-ipa-ua.js \
              && grep -Fq 'softSyllabify' /tmp/deployed-engine.js \
              && grep -Fq 'UNVERIFIED_ORTHOGRAPHIC_FALLBACK' /tmp/deployed-engine.js; then
              latin_line=$(grep -nF "continuousPanel('01 · Латинський запис'" /tmp/deployed-app.js | cut -d: -f1)
              ipa_line=$(grep -nF "continuousPanel('02 · Запис звуків IPA'" /tmp/deployed-app.js | cut -d: -f1)
              ukrainian_line=$(grep -nF "continuousPanel('03 · Українськими літерами'" /tmp/deployed-app.js | cut -d: -f1)
              test "$latin_line" -lt "$ipa_line"
              test "$ipa_line" -lt "$ukrainian_line"
              echo "Published plain-language service and transcription pipeline verified at $PAGE_URL"
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Published plain-language service did not appear after 12 attempts" >&2
              for marker in 'Як прочитати тайський текст українською' 'Вставте слово або речення тайською' 'ТЕСТОВА ВЕРСІЯ' 'Що означає результат'; do
                grep -Fq "$marker" /tmp/deployed-index.html || echo "Missing homepage marker: $marker" >&2
              done
              exit 1
            fi
            sleep 5
          done
