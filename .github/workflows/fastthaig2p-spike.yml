name: FastThaiG2P integration spike
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/run_fastthaig2p_challenge.py"
      - "tests/test_fastthaig2p_challenge.py"
      - "data/benchmark/thai_g2p_challenge.jsonl"
      - ".github/workflows/fastthaig2p-spike.yml"
      - "docs/research/fastthaig2p-integration-spike.md"
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Install pinned PyThaiNLP runtime
        run: python -m pip install pythainlp==5.4.0
      - name: Install pinned optional FastThaiG2P comparator without dependency drift
        run: python -m pip install --no-deps "git+https://github.com/awslabs/FastThaiG2P.git@4e82a291b4cf2876326744c6580121e9986ad354"
      - run: pytest -q tests/test_fastthaig2p_challenge.py
      - name: Run paired 42-item challenge comparison
        run: python scripts/run_fastthaig2p_challenge.py --output /tmp/fastthaig2p-challenge-comparison.json
      - name: Enforce report evidence grade and denominator
        run: |
          python -c "import json; r=json.load(open('/tmp/fastthaig2p-challenge-comparison.json',encoding='utf-8')); s=r['summary']; assert r['report_type']=='ENGINE_COMPARISON_DIAGNOSTIC_NOT_ACCURACY_BENCHMARK'; assert r['challenge']['record_count']==42; assert r['challenge']['gold_status']=='NO_INDEPENDENTLY_ADJUDICATED_IPA'; assert s['challenge_inputs']==42; assert 'accuracy' not in s"
      - uses: actions/upload-artifact@v7
        with:
          name: fastthaig2p-challenge-comparison
          path: /tmp/fastthaig2p-challenge-comparison.json
          if-no-files-found: error
