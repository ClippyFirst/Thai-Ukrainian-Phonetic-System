name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/generate_derived.py
      - run: python scripts/generate_syllable_space.py
      - run: git diff --exit-code -- docs/generated-audit.json docs/syllable-space.json
      - run: python -m unittest discover -s tests -v
