name: CI
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Lint Python source, tests and scripts
        run: ruff check src tests scripts
      - run: python -m pip install pythainlp==5.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node web/tests/rtgs-reference.test.mjs
      - run: python scripts/generate_web_word_dictionary.py
      - run: node web/tests/mode-adversarial.test.mjs
      - run: python scripts/test_rtgs_parity.py
      - run: python scripts/generate_derived.py
      - run: python scripts/generate_syllable_space.py
      - run: git diff --exit-code -- docs/generated-audit.json docs/syllable-space.json docs/source-final-manifest.json
      - run: python scripts/generate_master_table.py
      - name: Verify committed master-table registries are up to date
        run: git diff --exit-code -- data/derived/thai_consonant_correspondence.csv data/derived/thai_orthographic_correspondence.csv data/derived/thai_vowel_correspondence.csv data/derived/thai_ukrainian_master.json
      - name: Validate source and reviewer evidence registries
        run: python scripts/validate_evidence_registry.py
      - name: Validate the blind Thai adjudication packet
        run: python scripts/validate_adjudication_packet.py --mode blind --challenge data/benchmark/thai_g2p_challenge.jsonl data/benchmark/ipa-adjudication-blind.tsv
      - name: Validate the supplemental blind Thai regression packet
        run: python scripts/validate_adjudication_packet.py --mode blind --challenge data/benchmark/thai_g2p_supplemental_challenge.jsonl data/benchmark/ipa-adjudication-supplemental-blind.tsv
      - name: Validate the candidate-blind Ukrainian preference packet
        run: python scripts/validate_ukrainian_preference_packet.py data/benchmark/ukrainian-target-preference-blind.tsv
      - name: Run the complete Python test suite (pytest functions and unittest classes)
        run: python -m pytest -q -ra
      - name: Inspect supplied CCOST and LOTUSDIS TextGrid archives (TextGrid members only)
        run: |
          python scripts/inspect_ccost_textgrid.py "CCOST textgrid.zip" "nectecLOTUSDIS textgrid.zip" --output /tmp/textgrid-archive-inspection.json --quiet --report-only
          python - <<'PY'
          import collections, json
          report = json.load(open('/tmp/textgrid-archive-inspection.json', encoding='utf-8'))
          tier_samples = {}
          for file in report['files']:
              for tier, data in file['tiers'].items():
                  samples = tier_samples.setdefault(tier, [])
                  for label in data['samples']:
                      if label not in samples and len(samples) < 12:
                          samples.append(label)
          failure_counts = collections.Counter(
              (item.get('tier', 'FILE'), item.get('raw_label', item.get('error', '')))
              for item in report['failures']
          )
          print(json.dumps({
              'files_inspected': report['files_inspected'],
              'archives': [{k: v for k, v in item.items() if k != 'textgrid_members'}
                           | {'textgrid_member_examples': item['textgrid_members'][:5]}
                           for item in report['archives']],
              'tier_nonempty_label_counts': report['tier_nonempty_label_counts'],
              'tier_label_samples': tier_samples,
              'converted_label_counts': report['converted_label_counts'],
              'bracket_marker_counts': report['bracket_marker_counts'],
              'failure_count': len(report['failures']),
              'file_errors': [item for item in report['failures'] if 'tier' not in item],
              'failure_groups': [
                  {'tier': key[0], 'label_or_error': key[1], 'count': count}
                  for key, count in failure_counts.most_common(40)
              ],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Export selected orthographic TextGrid intervals without audio
        run: |
          python scripts/export_textgrid_text.py "CCOST textgrid.zip" "nectecLOTUSDIS textgrid.zip" --tier ORT-MAU --tier TRN --tier-prefix Hijack_ --output /tmp/textgrid-orthographic-text.jsonl
          python - <<'PY'
          import collections, json
          rows = [json.loads(line) for line in open('/tmp/textgrid-orthographic-text.jsonl', encoding='utf-8')]
          sources = collections.Counter(row['source'] for row in rows)
          assert len(rows) == 178377, len(rows)
          assert sources == {'CCOST': 145434, 'LOTUSDIS': 32943}, sources
          assert all(row['evidence_grade'] == 'SOURCE_ANNOTATED_NOT_GOLD' for row in rows)
          assert all(row['license'] in {'CC-BY-NC-SA-4.0', 'CC-BY-SA-4.0'} for row in rows)
          assert all('audio' not in row for row in rows)
          print(json.dumps({'records': len(rows), 'by_source': sources, 'audio_read': False, 'gold_promoted': False}))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: textgrid-archive-inspection
          path: /tmp/textgrid-archive-inspection.json
          if-no-files-found: error
      - name: Export orthographic TextGrid intervals as provenance-rich JSONL (no audio)
        run: |
          python scripts/export_textgrid_text.py "CCOST textgrid.zip" --tier ORT-MAU --tier TRN --output /tmp/ccost-orthographic.jsonl
          python scripts/export_textgrid_text.py "nectecLOTUSDIS textgrid.zip" --tier-prefix Hijack_ --output /tmp/lotusdis-transcripts.jsonl
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = [Path("/tmp/ccost-orthographic.jsonl"), Path("/tmp/lotusdis-transcripts.jsonl")]
          manifest = {}
          for path in files:
              payload = path.read_bytes()
              manifest[path.name] = {
                  "records": sum(1 for line in payload.splitlines() if line.strip()),
                  "bytes": len(payload),
                  "sha256": hashlib.sha256(payload).hexdigest(),
              }
          Path("/tmp/textgrid-text-only-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: textgrid-text-only-jsonl
          path: |
            /tmp/ccost-orthographic.jsonl
            /tmp/lotusdis-transcripts.jsonl
            /tmp/textgrid-text-only-manifest.json
          if-no-files-found: error
      - name: Build the static dependency graph and test-overlap inventory
        run: python scripts/audit_repository_structure.py --output /tmp/repository-structure-audit.json --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: repository-static-dependency-and-test-audit
          path: /tmp/repository-structure-audit.json
          if-no-files-found: error
      - run: python scripts/run_challenge_diagnostics.py --output /tmp/challenge-runtime-diagnostics.json
      - run: python -c "import json; r=json.load(open('/tmp/challenge-runtime-diagnostics.json',encoding='utf-8')); s=r['summary']; assert s['challenge_inputs']==42, s; assert s['inputs_with_engine_output']+s['inputs_abstained_or_without_complete_output']==42, s; assert r['evaluation_kind']=='runtime_diagnostic_not_accuracy_benchmark'; assert 'accuracy' not in s"
      - uses: actions/upload-artifact@v7
        with:
          name: thai-challenge-runtime-diagnostics
          path: /tmp/challenge-runtime-diagnostics.json
          if-no-files-found: error
      - run: node web/tests/ipa-ua.test.mjs
      - run: node web/tests/parity.test.mjs
      - run: node web/tests/ui-contract.test.mjs
      - name: Check static accessibility contracts and selected WCAG AA contrast pairs
        run: node web/tests/accessibility-contract.test.mjs
      - name: Benchmark browser Thai text segmentation latency
        run: node scripts/benchmark_web_segmentation.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: thai-browser-segmentation-latency-diagnostic
          path: /tmp/thai-browser-segmentation-benchmark.json
          if-no-files-found: error
      - run: python scripts/run_wisesight_segmentation_diagnostic.py --output /tmp/wisesight1000-segmentation-baseline.json
      - run: python -c "import json; r=json.load(open('/tmp/wisesight1000-segmentation-baseline.json',encoding='utf-8')); g=r['gold']; e=r['engines']['clippyfirst-text-tokenizer-baseline']; assert g['rows_total']==993 and g['rows_source_annotated']==993 and g['rows_adjudicated']==0, g; assert g['status']=='MEASURED_ON_SOURCE_ANNOTATED_ROWS_NOT_EXPERT_ADJUDICATED', g; assert e['n_gold_rows']==993 and e['coverage']==1.0, e; assert 'not expert-adjudicated' in r['method']['accuracy_claim']"
      - run: python scripts/run_dictionary_segmentation_diagnostic.py --output /tmp/wisesight1000-dictionary-segmentation.json
      - run: python scripts/build_ukrainian_target_candidates.py --check
      - run: python -c "import json; r=json.load(open('/tmp/wisesight1000-dictionary-segmentation.json',encoding='utf-8')); g=r['gold']; e=r['engines']['clippyfirst-dictionary-max-match']; assert g['rows_total']==993 and g['rows_source_annotated']==993 and g['rows_adjudicated']==0, g; assert g['status']=='MEASURED_ON_SOURCE_ANNOTATED_ROWS_NOT_EXPERT_ADJUDICATED', g; assert e['n_gold_rows']==993 and e['coverage']==1.0, e; assert 'not expert-adjudicated' in r['method']['accuracy_claim']"
      - name: Analyze representative segmentation boundary errors
        run: python scripts/analyze_segmentation_errors.py --output /tmp/thai-segmentation-error-review.json
      - name: Validate evidence grade and error review coverage
        run: python -c "import json; r=json.load(open('/tmp/thai-segmentation-error-review.json',encoding='utf-8')); d=r['dataset']; m=r['metrics']; assert d['rows_total']==993 and d['rows_source_annotated']==993 and d['rows_expert_adjudicated']==0, d; assert d['license']=='CC0-1.0' and d['split']=='test', d; assert m['false_split_count']>0 and m['false_merge_count']>0, m; assert m['exact_sequence_count']==204, m; assert r['report_type']=='SEGMENTATION_ERROR_TRIAGE_NOT_GOLD_ADJUDICATION'; assert r['method']['caveats']"
      - run: python scripts/run_source_attested_ipa_diagnostic.py --output /tmp/source-attested-ipa-diagnostic.json
      - run: python -c "import json; r=json.load(open('/tmp/source-attested-ipa-diagnostic.json',encoding='utf-8')); s=r['summary']; records=r['records']; assert r['source_evidence_grade']=='SOURCE_ATTESTED_NOT_GOLD'; assert s['source_records']==7 and len(records)==7; assert s['accuracy_claimed'] is False; assert s['source_override_circular_count']==5, s; assert s['independently_comparable_records']==2, s; assert s['source_override_circular_count']==sum(bool(x['circular_source_override']) for x in records), s; assert s['independently_comparable_records']==sum(not bool(x['circular_source_override']) and x['engine_segmental_ipa'] is not None for x in records), s"
      - name: Train pinned TUD segmentation model and evaluate held-out splits
        run: |
          python scripts/train_tud_word_segmenter.py --model /tmp/thai-tud-word-model.json --report /tmp/thai-tud-word-segmentation-report.json
          python -c "import json; r=json.load(open('/tmp/thai-tud-word-segmentation-report.json',encoding='utf-8')); assert r['training']['wisesight_used'] is False; assert r['development']['groups'] > 0 and r['test']['groups'] > 0 and r['wisesight_test_only']['groups'] > 0; assert r['source_license']=='CC-BY-SA-4.0'; assert r['status']=='RESEARCH_SEGMENTER_DIAGNOSTIC_NOT_RELEASE_VALIDATION'"
      - name: Compare segmentation error review on identical held-out rows
        run: python scripts/compare_segmentation_error_review.py --tud-model /tmp/thai-tud-word-model.json --output /tmp/thai-segmentation-comparative-error-review.json
      - name: Validate comparative segmentation evidence grade
        run: python -c "import json; r=json.load(open('/tmp/thai-segmentation-comparative-error-review.json',encoding='utf-8')); d=r['dataset']; assert d['rows_total']==993 and d['rows_source_annotated']==993 and d['rows_expert_adjudicated']==0 and d['same_rows_for_both_engines'] is True, d; assert d['license']=='CC0-1.0' and d['split']=='test', d; assert set(r['models'])=={'dictionary_max_match','tud_unigram_viterbi'}; [(_ for _ in ()).throw(AssertionError(name)) for name, e in r['models'].items() if e['metrics']['false_split_count']<=0 or e['metrics']['false_merge_count']<=0]; assert r['report_type']=='COMPARATIVE_SEGMENTATION_ERROR_TRIAGE_NOT_GOLD_ADJUDICATION'; assert r['method']['caveats']; assert all(e['false_split_examples'] and e['false_merge_examples'] for e in r['models'].values())"
      - name: Build unadjudicated manual segmentation review sample
        run: python scripts/build_segmentation_manual_review.py --report /tmp/thai-segmentation-comparative-error-review.json --tud-model /tmp/thai-tud-word-model.json --output /tmp/thai-segmentation-manual-review.tsv --sample-per-stratum 8 --control-sample 12 --seed thai-segmentation-review-v1
      - name: Validate manual review sample remains unadjudicated
        run: python -c "import csv,json; rows=list(csv.DictReader(open('/tmp/thai-segmentation-manual-review.tsv',encoding='utf-8'),delimiter='\\t')); assert rows; assert any('UNIFORM_CONTROL' in r['sampled_for'].split(';') for r in rows); assert all(r['gold_status']=='SOURCE_ANNOTATED' and r['adjudicated']=='NO' and not r['human_decision'] and not r['reviewer_id'] and not r['decision_rationale'] for r in rows); assert all(''.join(json.loads(r[k]))==r['text'] for r in rows for k in ('gold_tokens_json','dictionary_tokens_json','tud_tokens_json'))"
      - uses: actions/upload-artifact@v7
        with:
          name: thai-tud-word-segmentation-model-and-report
          path: |
            /tmp/thai-tud-word-model.json
            /tmp/thai-tud-word-segmentation-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: wisesight1000-segmentation-baseline
          path: /tmp/wisesight1000-segmentation-baseline.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: wisesight1000-dictionary-segmentation
          path: /tmp/wisesight1000-dictionary-segmentation.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: thai-segmentation-error-review
          path: /tmp/thai-segmentation-error-review.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: thai-segmentation-comparative-error-review
          path: |
            /tmp/thai-segmentation-comparative-error-review.json
            /tmp/thai-segmentation-manual-review.tsv
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: source-attested-ipa-diagnostic
          path: /tmp/source-attested-ipa-diagnostic.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: thai-ukrainian-master-table
          path: |
            data/derived/thai_ukrainian_master.csv
            data/derived/thai_ukrainian_master_2col.csv
            data/derived/thai_ukrainian_master.json
          if-no-files-found: error
  master-artifact:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: thai-ukrainian-master-table
          path: data/derived
      - name: Validate the generated master artifact
        run: python -c "import json; m=json.load(open('data/derived/thai_ukrainian_master.json',encoding='utf-8')); assert m['rows']==m['expected_rows']==351780; assert m['vowel_records']==41"

  wheel-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the declared setuptools build backend
        run: python -m pip install "setuptools>=68"
      - name: Build source distribution with declared runtime data
        run: python setup.py sdist --dist-dir "$RUNNER_TEMP/sdist"
      - name: Build wheel from source distribution
        run: python -m pip wheel "$RUNNER_TEMP"/sdist/*.tar.gz --no-deps --wheel-dir "$RUNNER_TEMP/wheels"
      - name: Install wheel into an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/wheels/*.whl
      - name: Smoke-test installed package data outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/scripts/wheel_install_smoke.py"
