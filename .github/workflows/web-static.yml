name: Web static validation
on:
  push:
    paths:
      - "web/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/web-static.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/web-static.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install research package
        run: python -m pip install -e .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate pinned CC0 browser word dictionary
        run: python scripts/generate_web_word_dictionary.py
      - name: Check browser JavaScript syntax
        run: |
          node --check web/src/app.js
          node --check web/src/fastthaig2p-native.js
          node --check web/src/fastthaig2p-normalizer.js
          node --check web/src/messages.uk.js
          node --check web/src/fastthaig2p-worker.js
          node --check web/src/engine.js
          python scripts/generate_web_fixtures.py
          cmp web/tests/fixtures.json web/tests/fixtures.python.json
          node web/tests/parity.test.mjs
      - name: Check required pages
        run: |
          test -s web/index.html
          test -s web/system.html
          test -s web/src/styles.css
          test -s web/src/app.js
      - name: Check static accessibility contract
        run: |
          grep -q '<html lang="uk">' web/index.html
          grep -q 'for="thai-input"' web/index.html
          grep -q 'id="thai-input"' web/index.html
          grep -q 'role="status"' web/index.html
          grep -q 'focus-visible' web/src/styles.css
          grep -q 'Content-Security-Policy' web/index.html
          grep -q 'Content-Security-Policy' web/system.html
      - name: Run localization, UI and static accessibility contracts
        run: |
          node web/tests/accessibility-contract.test.mjs
          node web/tests/ukrainian-first.test.mjs
          node web/tests/fastthaig2p-native.test.mjs
          node web/tests/ui-contract.test.mjs
      - name: Validate third-party notices and dataset attribution
        run: node web/tests/third-party-notices.test.mjs
      - name: Check no remote runtime dependency
        run: |
          ! grep -E '(<script[^>]+src="https?://|<link[^>]+href="https?://)' web/index.html web/system.html
