name: Transcribe all names in data/db.csv

on:
  push:
    branches:
      - feat/transcribe-db-csv-all-names-2026-11-09
    paths:
      - ".github/workflows/transcribe-geographic-db.yml"
      - "data/db.csv"
      - "scripts/build_geographic_dictionary.py"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transcribe-geographic-db-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install geographic transcription dependency
        run: python -m pip install -e ".[geography]"

      - name: Evaluate SSG syllable fallback on a representative sample
        run: |
          python - <<'PY'
          import csv, json
          from pythainlp.tokenize import syllable_tokenize
          from thai_ukrainian.api import analyze_syllable
          with open("data/db.csv", encoding="utf-8-sig", newline="") as stream:
              rows = list(csv.DictReader(stream, delimiter=";"))[:500]
          counts = {"names": len(rows), "all_syllables_parse": 0, "some_syllables_parse": 0, "none_parse": 0, "syllable_count": 0, "examples": []}
          for row in rows:
              syllables = [x for x in syllable_tokenize(row["name_th"], engine="dict", keep_whitespace=False) if x.strip()]
              results = [analyze_syllable(s) for s in syllables]
              ok = [a.status == "analyzed" and bool(a.phonemic_ipa) and bool(a.ukrainian_transliteration) for a in results]
              counts["syllable_count"] += len(syllables)
              if ok and all(ok): counts["all_syllables_parse"] += 1
              elif any(ok): counts["some_syllables_parse"] += 1
              else: counts["none_parse"] += 1
              if len(counts["examples"]) < 20 and (not ok or not all(ok)):
                  counts["examples"].append({"id": row["id"], "name_th": row["name_th"], "syllables": syllables, "statuses": [a.status for a in results]})
          print(json.dumps(counts, ensure_ascii=False, indent=2))
          PY

      - name: Transcribe every source row
        run: |
          mkdir -p build
          python scripts/build_geographic_dictionary.py data/db.csv \
            --thai-column name_th \
            --delimiter ";" \
            --output build/db-transcribed.csv

      - name: Validate row preservation and report coverage
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          source = Path("data/db.csv")
          output = Path("build/db-transcribed.csv")
          with source.open(encoding="utf-8-sig", newline="") as f:
              src = list(csv.DictReader(f, delimiter=";"))
          with output.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f, delimiter=";"))
          assert len(rows) == len(src), (len(src), len(rows))
          assert all(a["id"] == b["id"] and a["name_th"] == b["name_th"] for a, b in zip(src, rows))
          statuses = {}
          for row in rows:
              statuses[row["pipeline_status"]] = statuses.get(row["pipeline_status"], 0) + 1
          report = {
              "source": str(source),
              "source_rows": len(src),
              "output_rows": len(rows),
              "romanization_nonempty": sum(bool(r["romanization_rtgs"]) for r in rows),
              "ipa_phonemic_nonempty": sum(bool(r["ipa_phonemic"]) for r in rows),
              "ipa_broad_surface_nonempty": sum(bool(r["ipa_broad_surface"]) for r in rows),
              "ukrainian_nonempty": sum(bool(r["ukrainian_from_ipa"]) for r in rows),
              "status_counts": statuses,
              "note": "Model candidates; not independently adjudicated linguistic gold."
          }
          Path("build/db-transcription-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Publish generated CSV and report on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/geography
          cp build/db-transcribed.csv data/geography/db-transcribed.csv
          cp build/db-transcription-report.json data/geography/db-transcription-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geography/db-transcribed.csv data/geography/db-transcription-report.json
          if git diff --cached --quiet; then
            echo "Generated output is unchanged."
          else
            git commit -m "data: transcribe all Thai names from db.csv"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
