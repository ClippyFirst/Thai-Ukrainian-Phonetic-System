name: Optional external Thai G2P smoke benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_external_g2p_benchmark.py"
      - "data/benchmark/thai_g2p_challenge.jsonl"
  pull_request:
    paths:
      - "scripts/run_external_g2p_benchmark.py"
      - "data/benchmark/thai_g2p_challenge.jsonl"
      - ".github/workflows/optional-external-g2p.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
      - name: Install pinned optional comparators
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pythainlp==5.4.0" "thaiphon==0.7.0" "git+https://github.com/awslabs/FastThaiG2P.git@c4759eef7df03e11fcbb9aa83efe8cf21709fd2f"
      - name: Build pinned Goruut comparator
        run: |
          git clone https://github.com/neurlang/goruut.git "$RUNNER_TEMP/goruut-src"
          git -C "$RUNNER_TEMP/goruut-src" checkout b224bde02151f8f86d0fe260804e4ca743bda620
          cd "$RUNNER_TEMP/goruut-src"
          go build -o "$RUNNER_TEMP/goruut" ./cmd/goruut
      - name: Start Goruut and verify Thai endpoint
        run: |
          "$RUNNER_TEMP/goruut" -configfile "$RUNNER_TEMP/goruut-src/configs/config.json" > "$RUNNER_TEMP/goruut.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/goruut.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail -X POST http://127.0.0.1:18080/tts/phonemize/sentence -H "Content-Type: application/json" -d '{"Language":"Thai","Sentence":"กา"}' > "$RUNNER_TEMP/goruut-ready.json"; then
              cat "$RUNNER_TEMP/goruut-ready.json"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/goruut.log"
          exit 1
      - name: Run raw-output benchmark with all available comparators
        run: |
          mkdir -p artifacts
          python scripts/run_external_g2p_benchmark.py --goruut-url http://127.0.0.1:18080/tts/phonemize/sentence --goruut-language Thai --output artifacts/external-g2p-latest.jsonl | tee artifacts/summary.json
      - name: Upload raw outputs and run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thai-external-g2p-smoke
          path: |
            artifacts/external-g2p-latest.jsonl
            artifacts/summary.json
          if-no-files-found: warn
          retention-days: 30
