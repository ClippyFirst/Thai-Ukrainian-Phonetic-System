name: FastThaiG2P Pyodide compatibility
on:
  push:
    paths:
      - "src/thai_ukrainian/**"
      - "web/src/**"
      - "web/index.html"
      - "web/tests/fastthaig2p-browser.test.mjs"
      - "scripts/fastthaig2p_pyodide_parity.py"
      - "web/tests/fastthaig2p-pyodide.test.mjs"
      - "pyproject.toml"
      - ".github/workflows/pyodide-compat.yml"
  pull_request:
    paths:
      - "src/thai_ukrainian/**"
      - "scripts/fastthaig2p_pyodide_parity.py"
      - "web/tests/fastthaig2p-pyodide.test.mjs"
      - "pyproject.toml"
      - ".github/workflows/pyodide-compat.yml"

permissions:
  contents: read

jobs:
  pyodide-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build pinned pure-Python wheels
        run: |
          mkdir -p build/pyodide-wheels
          python -m pip wheel --no-deps --wheel-dir build/pyodide-wheels .
          python -m pip download --no-deps --only-binary=:all: --dest build/pyodide-wheels pythainlp==5.4.0
          python -m pip download --no-deps --only-binary=:all: --dest build/pyodide-wheels tzdata==2026.6
          python -m pip wheel --no-deps --wheel-dir build/pyodide-wheels "fastthaig2p @ git+https://github.com/awslabs/FastThaiG2P.git@4e82a291b4cf2876326744c6580121e9986ad354"
          test "$(find build/pyodide-wheels -maxdepth 1 -name '*.whl' | wc -l)" -eq 4
          sha256sum build/pyodide-wheels/*.whl
          du -h build/pyodide-wheels/*.whl
      - name: Generate CPython reference and verify upstream pin
        run: |
          python -m pip install --no-deps build/pyodide-wheels/*.whl
          python scripts/fastthaig2p_pyodide_parity.py > build/fastthaig2p-native.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("build/fastthaig2p-native.json").read_text())
          assert payload["upstream_commit"] == "4e82a291b4cf2876326744c6580121e9986ad354"
          assert len(payload["cases"]) == 4
          garden = next(case for case in payload["cases"] if case["input"] == "สวน")
          assert garden["result"]["status_code"] == 200
          assert garden["result"]["body"]["raw_ipa"] == "/sua̯n˩˩˦/"
          PY
      - name: Install pinned Pyodide runtime and browser runner
        run: npm install --no-save --no-package-lock pyodide@0.29.5 playwright@1.64.1
      - name: Run CPython versus Pyodide parity
        run: node web/tests/fastthaig2p-pyodide.test.mjs build/pyodide-wheels build/fastthaig2p-native.json
      - name: Stage same-origin runtime assets for browser smoke
        run: |
          mkdir -p web/vendor/pyodide web/vendor/wheels
          cp -R node_modules/pyodide/. web/vendor/pyodide/
          cp build/pyodide-wheels/*.whl web/vendor/wheels/
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the real same-origin Pyodide worker in Chromium
        run: node web/tests/fastthaig2p-browser.test.mjs
