name: Відгук про бета-версію
description: Повідомте про проблему з користуванням, неочікуваний результат або питання доступності.
title: "[Відгук про бета-версію]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Дякуємо, що допомагаєте вдосконалювати бета-версію. Не додавайте особистий, конфіденційний чи інший чутливий текст. Не завантажуйте аудіо. Тайські приклади необов’язкові: додавайте лише матеріали, які маєте право оприлюднювати.
  - type: dropdown
    id: category
    attributes:
      label: Категорія відгуку
      options:
        - "Неочікуваний результат: тайський текст → IPA → український запис"
        - Непідтримуване введення або незрозуміле обмеження
        - Помилка сайту або обробки тексту
        - Доступність або зручність користування
        - Документація або повідомлення про приватність
        - Інше
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Що сталося?
      description: Опишіть проблему, не додаючи конфіденційних даних.
      placeholder: Що ви зробили та який результат побачили?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Необов’язковий публічний приклад тайською
      description: Додавайте лише текст, який маєте право оприлюднювати. Не вказуйте імена, персональні дані чи приватні повідомлення.
      render: text
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Очікувана поведінка
      description: Що, на вашу думку, мала зробити бета-версія?
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Браузер і версія
      placeholder: "Наприклад: Firefox 132"
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Пристрій та операційна система
      placeholder: "Наприклад: Android 16, Windows 11"
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Кроки для відтворення
      description: Перелічіть найкоротші кроки, після яких виникає проблема.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Підтвердження щодо приватності
      options:
        - label: Підтверджую, що не додаю особистої, конфіденційної чи чутливої інформації та маю право публічно поширювати всі наведені приклади.
          required: true
